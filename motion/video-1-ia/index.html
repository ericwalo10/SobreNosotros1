<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video 1 · Finanflix IA</title>
<style>
  /* Sharp Grotesk es la tipografía de marca (licencia pendiente); Space Grotesk (OFL) la reemplaza en el animatic. */
  @font-face { font-family: "Space Grotesk"; font-weight: 300 700; font-display: block;
    src: url("../fonts/SpaceGrotesk-latin.woff2") format("woff2"); }
  :root {
    --bg: #1A1A23;
    --surface: #282844;
    --accent: #FF3F00;
    --text: #F5F5F7;
    --muted: #9A9AB0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0E0E14; color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  #stage { width: min(100%, calc((100vh - 170px) * 9 / 16)); aspect-ratio: 9 / 16; background: var(--bg);
    border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); display: block; }
  #controls { width: min(100%, 720px); display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, label { font: inherit; font-size: 14px; }
  button { background: var(--surface); color: var(--text); border: 1px solid #3a3a5c; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; min-width: 96px; color: var(--muted); font-size: 14px; }
  #scenes { display: flex; flex-wrap: wrap; gap: 6px; }
  #scenes button { font-size: 12px; padding: 4px 8px; }
  #scenes button.on { border-color: var(--accent); color: var(--accent); }
  body.render { padding: 0; background: var(--bg); }
  body.render #controls { display: none; }
  body.render #stage { width: 1080px; height: 1920px; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div id="controls">
  <div class="row">
    <button id="play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="40" step="0.01" value="0">
    <span id="time">0.00 / 40.00</span>
  </div>
  <div class="row">
    <label><input id="safe" type="checkbox"> Zona segura de Reels</label>
    <label><input id="draft" type="checkbox" checked> Marca de borrador</label>
  </div>
  <div id="scenes"></div>
</div>
<script>
// ---------------------------------------------------------------------------
// Datos del caso. Todo lo que está entre corchetes se copia de la respuesta
// original de la IA y de la serie de precios real (ver RESUMEN.md, Video 1).
// `suba` es numérico cuando se conozca (ej. 133); mientras sea null se muestra "[Z]".
// ---------------------------------------------------------------------------
const CASE = {
  moneda: '[MONEDA]',
  fecha: '[FECHA]',
  mecha: '[X]',
  fib: '[Y]',
  suba: null,
  fechaExport: '[FECHA DE EXPORTACIÓN]',
  casos: [
    { moneda: '[MONEDA 2]', fecha: '[FECHA]', suba: '[Z2]' },
    { moneda: '[MONEDA 3]', fecha: '[FECHA]', suba: '[Z3]' },
  ],
  pregunta: '¿Llegué tarde a BTC?',
  frases: ['"[Frase literal 1 de la respuesta]"', '"[Frase literal 2 de la respuesta]"'],
  caidaCartera: '[X]',
};

const W = 1080, H = 1920, DURATION = 40, FPS = 30;
const SAFE_TOP = 250, SAFE_BOTTOM = H - 400;
const C = {
  bg: '#1A1A23', surface: '#282844', surface2: '#33335A', accent: '#FF3F00', violet: '#5328C1',
  text: '#F5F5F7', muted: '#9A9AB0', dim: '#5A5A78', red: '#FF3B3B', black: '#0E0E14',
};
const FONT = '"Space Grotesk", system-ui, sans-serif';

const SCENES = [
  { a: 0,  b: 3,  name: 'Gancho' },
  { a: 3,  b: 7,  name: 'La zona' },
  { a: 7,  b: 12, name: 'Lo que pasó' },
  { a: 12, b: 15, name: 'Más casos' },
  { a: 15, b: 18, name: 'Tracción' },
  { a: 18, b: 22, name: 'Método' },
  { a: 22, b: 30, name: 'Demo de hoy' },
  { a: 30, b: 34, name: 'Tu cartera' },
  { a: 34, b: 37, name: 'Decisión' },
  { a: 37, b: 40, name: 'CTA' },
];

// --- easing -----------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
// Rebote elástico amortiguado (spring physics de la referencia).
const spring = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6 * p) * Math.cos(10 * p);
const fade = (t, a, b, f = .2) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));

// --- serie ilustrativa (reemplazar por la real) ------------------------------
function mulberry32(s) {
  return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const N = 110, CRASH = 55, RESP = 60, WICK = 52, FIB = 60;
const candles = (() => {
  const r = mulberry32(7), out = [];
  const target = i => i < CRASH ? 100 - i * .38
    : i < 66 ? 75 - (i - CRASH) * .9
    : i < 74 ? 63 - Math.sin((i - 66) / 8 * Math.PI) * 4
    : 62 + Math.pow((i - 74) / 36, 1.6) * 78;
  let prev = 100;
  for (let i = 0; i < N; i++) {
    const o = prev, c = target(i) + (r() - .5) * 3;
    let h = Math.max(o, c) + r() * 2.2, l = Math.min(o, c) - r() * 2.2;
    if (i === CRASH) l = WICK;
    if (i === 70) l = Math.min(l, FIB - 2.5);
    out.push({ o, h, l, c }); prev = c;
  }
  return out;
})();
const TOUCH = candles.findIndex((k, i) => i > RESP && k.l <= FIB);

// --- dibujo -------------------------------------------------------------------
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const S = { safe: false, draft: true };

function font(size, weight = 500) { return `${weight} ${size}px ${FONT}`; }
function text(str, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.font = font(o.size ?? 64, o.weight ?? 700);
  ctx.fillStyle = o.color ?? C.text;
  ctx.textAlign = o.align ?? 'center';
  ctx.textBaseline = o.baseline ?? 'alphabetic';
  const lines = o.maxWidth ? wrap(str, o.maxWidth) : [str];
  const lh = (o.size ?? 64) * (o.lh ?? 1.15);
  lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lh));
  ctx.restore();
  return lines.length * lh;
}
function wrap(str, max) {
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > max && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
// Texto de una línea con segmentos de color: [['La decisión, '], ['tuya.', C.accent]]
function rich(segs, x, y, size, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font(size, 700); ctx.textBaseline = 'alphabetic';
  const total = segs.reduce((s, [t]) => s + ctx.measureText(t).width, 0);
  let cx = x - total / 2;
  for (const [t, col] of segs) { ctx.fillStyle = col ?? C.text; ctx.textAlign = 'left'; ctx.fillText(t, cx, y);
    cx += ctx.measureText(t).width; }
  ctx.restore();
}
function rrect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}
function withAlpha(a, fn) { ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function withTransform(cx, cy, s, rot, fn) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot || 0); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore();
}
function footnote(str, alpha = 1) {
  text(str, W / 2, SAFE_BOTTOM - 24, { size: 26, weight: 400, color: C.muted, alpha, maxWidth: 900, lh: 1.3 });
}
// Pastilla de estado (E5): "Leyendo el material del programa…"
function pill(str, x, y, t, alpha = 1) {
  withAlpha(alpha, () => {
    ctx.font = font(30, 500);
    const w = ctx.measureText(str).width + 110;
    rrect(x - w / 2, y - 34, w, 68, 34, C.surface2);
    for (let i = 0; i < 3; i++) {
      const a = .35 + .65 * Math.max(0, Math.sin(t * 7 - i * .9));
      ctx.fillStyle = `rgba(255,63,0,${a})`;
      ctx.beginPath(); ctx.arc(x - w / 2 + 36 + i * 16, y, 5.5, 0, Math.PI * 2); ctx.fill();
    }
    text(str, x - w / 2 + 92, y + 11, { size: 30, weight: 500, align: 'left', color: C.text });
  });
}

// --- escenas 1-3: el caso del flash crash (0-12 s) -----------------------------
const CH = { x: 60, y: 600, w: 960, h: 780 };
function chartState(t) {
  const reveal = easeInOut(prog(t, 7.6, 11.4));
  const end = lerp(RESP, N - 1, reveal);
  const xEnd = lerp(RESP + 24, N + 2, reveal);
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i <= Math.floor(end); i++) { lo = Math.min(lo, candles[i].l); hi = Math.max(hi, candles[i].h); }
  lo = Math.min(lo, WICK); const pad = (hi - lo) * .12;
  return { end, xEnd, lo: lo - pad, hi: hi + pad };
}
function drawChart(t, st, opts = {}) {
  const px = CH.x + 50, pw = CH.w - 100, py = CH.y + 150, ph = CH.h - 230;
  const X = i => px + (i + .5) / st.xEnd * pw;
  const Y = v => py + (1 - (v - st.lo) / (st.hi - st.lo)) * ph;
  const cw = Math.max(2, pw / st.xEnd * .6);
  // grilla
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) { const y = py + g * ph / 4; ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px + pw, y); ctx.stroke(); }
  // zona: línea de la mecha, 0.786 y banda
  const zp = opts.zone ?? 0;
  if (zp > 0) {
    const x1 = lerp(X(CRASH), px + pw, easeOut(clamp(zp * 1.4)));
    const x2 = lerp(X(CRASH), px + pw, easeOut(clamp(zp * 1.4 - .4)));
    const band = easeOut(prog(zp, .55, 1));
    ctx.fillStyle = `rgba(255,63,0,${.16 * band})`;
    ctx.fillRect(X(CRASH), Y(FIB), (px + pw - X(CRASH)) * band, Y(WICK) - Y(FIB));
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.moveTo(X(CRASH), Y(WICK)); ctx.lineTo(x1, Y(WICK)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(X(CRASH), Y(FIB)); ctx.lineTo(x2, Y(FIB)); ctx.stroke();
  }
  // velas
  const full = Math.floor(st.end), frac = st.end - full;
  for (let i = 0; i <= full; i++) {
    const k = candles[i];
    const a = i === full && i > RESP ? Math.max(frac, .3) : 1;
    const up = k.c >= k.o;
    let col = up ? '#E8E8F0' : C.dim;
    if (i === CRASH && opts.wickPulse != null) col = C.red;
    withAlpha(a, () => {
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = i === CRASH ? 4 : 2;
      ctx.beginPath(); ctx.moveTo(X(i), Y(k.h)); ctx.lineTo(X(i), Y(k.l)); ctx.stroke();
      const y0 = Y(Math.max(k.o, k.c)), y1 = Y(Math.min(k.o, k.c));
      ctx.fillRect(X(i) - cw / 2, y0, cw, Math.max(2, y1 - y0));
    });
  }
  // la mecha late en rojo
  if (opts.wickPulse != null) {
    const p = .5 + .5 * Math.sin(opts.wickPulse * 9);
    ctx.save(); ctx.shadowColor = C.red; ctx.shadowBlur = 20 + 30 * p;
    ctx.strokeStyle = C.red; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(X(CRASH), Y(candles[CRASH].o)); ctx.lineTo(X(CRASH), Y(WICK)); ctx.stroke();
    ctx.restore();
  }
  // marcador de la fecha de la respuesta
  if (opts.respMark) withAlpha(opts.respMark, () => {
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(RESP), py - 10); ctx.lineTo(X(RESP), py + ph); ctx.stroke(); ctx.setLineDash([]);
  });
  return { X, Y, px, pw, py, ph };
}
function sceneCase(t) {
  const st = chartState(t);
  const push = 1 + .06 * easeOut(prog(t, 0, 3)) + .03 * easeInOut(prog(t, 7, 12));
  const inA = easeOut(prog(t, 0, .5));
  let g;
  withTransform(W / 2, CH.y + CH.h / 2, push * lerp(.94, 1, inA), 0, () => withAlpha(inA, () => {
    rrect(CH.x, CH.y, CH.w, CH.h, 28, C.surface);
    // cabecera de la respuesta de la IA
    rrect(CH.x + 30, CH.y + 30, 520, 84, 42, C.surface2);
    ctx.fillStyle = C.text; ctx.beginPath(); ctx.arc(CH.x + 76, CH.y + 72, 14, 0, Math.PI * 2); ctx.fill();
    text('Finanflix IA', CH.x + 104, CH.y + 70, { size: 30, weight: 700, align: 'left' });
    text(`${CASE.fecha} · ${CASE.moneda}`, CH.x + 104, CH.y + 100, { size: 24, weight: 400, align: 'left', color: C.muted });
    const touchAmt = st.end - TOUCH;
    const flash = touchAmt > 0 && touchAmt < 3 ? 1 - touchAmt / 3 : 0;
    g = drawChart(t, st, {
      wickPulse: t < 3.2 ? t : null,
      zone: prog(t, 3.1, 5.2),
      respMark: fade(t, 0, 7.2, .4),
    });
    if (flash > 0) { ctx.fillStyle = `rgba(255,63,0,${.35 * flash})`; ctx.fillRect(CH.x, CH.y, CH.w, CH.h); }
    // etiquetas de nivel (valores literales de la respuesta)
    const la = fade(t, 3.6, 7.3, .3);
    if (la > 0) {
      const lx = g.px + 10;
      const lab = (s, y, d) => withAlpha(la * easeOut(prog(t, 3.6 + d, 4.1 + d)), () => {
        ctx.font = font(28, 700); const w = ctx.measureText(s).width + 32;
        rrect(lx, y - 26, w, 52, 10, C.accent);
        text(s, lx + 16, y + 10, { size: 28, weight: 700, align: 'left', color: '#fff' });
      });
      lab(`Mecha del flash crash: US$ ${CASE.mecha}`, g.Y(WICK) + 50, 0);
      lab(`0.786: US$ ${CASE.fib}`, g.Y(FIB) - 50, .5);
    }
  }));

  // textos por escena
  const h1 = fade(t, .2, 3.1, .3);
  text(`${CASE.fecha}.`, W / 2, 380, { size: 76, alpha: h1 * easeOut(prog(t, .2, .6)) });
  text(`La IA analizó ${CASE.moneda}.`, W / 2, 470, { size: 60, weight: 500, color: C.muted, alpha: h1 * easeOut(prog(t, .6, 1)) });

  const h2 = fade(t, 3.1, 7.1, .3);
  text('La zona del método.', W / 2, 430, { size: 72, alpha: h2 });

  const h3 = fade(t, 7.1, 12.1, .3);
  if (h3 > 0) {
    const touched = st.end >= TOUCH;
    text('Lo que pasó después.', W / 2, 380, { size: 72, alpha: h3 * easeOut(prog(t, 7.1, 7.5)) });
    if (touched) {
      const k = easeOut(prog(st.end, TOUCH, TOUCH + 4));
      let val = `+${'[Z]'}%`;
      if (typeof CASE.suba === 'number') {
        const r = prog(st.end, TOUCH, N - 1);
        val = `+${Math.round(CASE.suba * easeOut(r)).toLocaleString('es-AR')}%`;
      }
      withTransform(W / 2, 470, lerp(1.25, 1, spring(k)), 0, () =>
        rich([[val, C.accent], [' desde la zona']], W / 2, 490, 64, h3 * k));
    }
    footnote(`Precio al ${CASE.fechaExport}`, h3 * easeOut(prog(t, 9, 9.4)));
  }
}

// --- escena 4: más casos, cartas en cascada (12-15 s) --------------------------
function sceneCases(t) {
  const a = fade(t, 12, 15.1, .25);
  if (!a) return;
  withAlpha(a, () => {
    const cards = [
      { moneda: CASE.moneda, fecha: CASE.fecha, suba: typeof CASE.suba === 'number' ? CASE.suba : '[Z]' },
      ...CASE.casos,
    ];
    cards.forEach((c, i) => {
      const p = spring(prog(t, 12.05 + i * .45, 12.9 + i * .45));
      const y = lerp(H + 200, 560 + i * 280, p);
      const rot = lerp(.25 * (i - 1), (i - 1) * .025, p);
      withTransform(W / 2, y + 110, lerp(.8, 1, p), rot, () => {
        rrect(110, y, 860, 220, 28, i === 0 ? C.surface2 : C.surface);
        text(c.moneda, 160, y + 92, { size: 56, align: 'left' });
        text(c.fecha, 160, y + 160, { size: 32, weight: 400, align: 'left', color: C.muted });
        text(`+${c.suba}%`, 920, y + 132, { size: 72, align: 'right', color: C.accent });
      });
    });
    text('Más casos.', W / 2, 430, { size: 72, alpha: easeOut(prog(t, 12, 12.4)) });
    footnote('Casos reales seleccionados. No representan todas las respuestas.', easeOut(prog(t, 12.4, 12.8)));
  });
}

// --- escena 5: tracción E1 con grilla que se aleja (15-18 s) ------------------
function sceneTraction(t) {
  const a = fade(t, 15, 18.1, .2);
  if (!a) return;
  withAlpha(a, () => {
    const z = lerp(2.6, 1, easeOut(prog(t, 15, 17.2)));
    const sp = 44 * z;
    for (let y = -sp; y < H + sp; y += sp) for (let x = (W / 2) % sp - sp; x < W + sp; x += sp) {
      const d = Math.hypot(x - W / 2, y - H / 2);
      const wave = .5 + .5 * Math.sin(d / 90 - t * 5);
      ctx.fillStyle = `rgba(255,255,255,${.04 + .08 * wave})`;
      ctx.beginPath(); ctx.arc(x, y, 3 * Math.min(z, 1.6), 0, Math.PI * 2); ctx.fill();
    }
    const n = Math.round(500 * easeOut(prog(t, 15.2, 16.2)));
    const s = lerp(1.15, 1, spring(prog(t, 15.2, 16.4)));
    withTransform(W / 2, 880, s, 0, () => text(`~${n}`, W / 2, 940, { size: 260, color: C.accent }));
    text('accesos nuevos a la IA', W / 2, 1080, { size: 60, alpha: easeOut(prog(t, 15.5, 15.9)) });
    text('por semana', W / 2, 1160, { size: 60, weight: 500, color: C.muted, alpha: easeOut(prog(t, 15.7, 16.1)) });
    footnote('Dato interno Finanflix, sep-2026', easeOut(prog(t, 15.8, 16.2)));
  });
}

// --- escena 6: capa de método E3; los "dots" son las capas reales ----------------
function sceneMethod(t) {
  const a = fade(t, 18, 22.1, .2);
  if (!a) return;
  withAlpha(a, () => {
    const t1 = fade(t, 18, 19.4, .25);
    text('No es un chat genérico.', W / 2, 900, { size: 80, alpha: t1, maxWidth: 900 });
    const t2 = easeOut(prog(t, 19.4, 19.8));
    text('Casi una década en el mercado cripto,', W / 2, 520, { size: 58, alpha: t2, maxWidth: 940 });
    text('en cada respuesta.', W / 2, 670, { size: 58, weight: 500, color: C.muted, alpha: t2 });
    const chips = [['Material del programa', C.accent], ['Fibonacci + estocástico', C.violet], ['Tu cartera', C.text]];
    chips.forEach(([s, col], i) => {
      const p = spring(prog(t, 19.8 + i * .45, 20.6 + i * .45));
      if (p <= 0) return;
      const y = 900 + i * 150;
      withTransform(W / 2, y, lerp(.4, 1, p), 0, () => withAlpha(clamp(p * 1.5), () => {
        ctx.font = font(44, 700); const w = ctx.measureText(s).width + 140;
        rrect(W / 2 - w / 2, y - 55, w, 110, 55, C.surface);
        const pulse = 1 + .15 * Math.sin(t * 6 + i);
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(W / 2 - w / 2 + 58, y, 16 * pulse, 0, Math.PI * 2); ctx.fill();
        text(s, W / 2 - w / 2 + 96, y + 15, { size: 44, align: 'left' });
      }));
    });
  });
}

// --- escenas 7-8: demo en el chat y lectura de cartera (22-34 s) ----------------
const PANEL = { x: 60, y: 500, w: 960, h: 900 };
function bubbleUser(s, y, a) {
  withAlpha(a, () => {
    ctx.font = font(36, 500); const w = Math.min(ctx.measureText(s).width + 64, 760);
    rrect(PANEL.x + PANEL.w - 40 - w, y, w, 84, 30, C.surface2);
    text(s, PANEL.x + PANEL.w - 40 - w / 2, y + 54, { size: 36, weight: 500, maxWidth: 700 });
  });
}
function sceneDemo(t) {
  const a = fade(t, 22, 30.1, .25);
  if (!a) return;
  withAlpha(a, () => {
    text('Hoy, preguntale por la tuya.', W / 2, 400, { size: 58, alpha: easeOut(prog(t, 22, 22.4)), maxWidth: 940 });
    const zoom = lerp(1, 1.08, easeInOut(prog(t, 27.2, 28.6)));
    withTransform(W / 2, 1000, zoom, 0, () => {
      rrect(PANEL.x, PANEL.y, PANEL.w, PANEL.h, 32, C.surface);
      // composer
      const cy = PANEL.y + PANEL.h - 130;
      rrect(PANEL.x + 30, cy, PANEL.w - 60, 100, 50, C.bg, 'rgba(255,255,255,.08)');
      const typed = CASE.pregunta.slice(0, Math.floor(CASE.pregunta.length * prog(t, 22.5, 23.8)));
      const sent = t >= 24;
      const caret = !sent && Math.floor(t * 2.5) % 2 === 0 ? '|' : '';
      text(sent ? 'Preguntale al método…' : typed + caret, PANEL.x + 80, cy + 63,
        { size: 36, weight: 400, align: 'left', color: sent || !typed ? C.dim : C.text });
      rrect(PANEL.x + PANEL.w - 124, cy + 14, 72, 72, 36, t > 23.8 && t < 24.1 ? C.text : C.accent);
      text('↑', PANEL.x + PANEL.w - 88, cy + 66, { size: 40, color: '#fff' });
      if (sent) {
        const p = easeOut(prog(t, 24, 24.35));
        bubbleUser(CASE.pregunta, lerp(cy - 20, PANEL.y + 40, p), 1);
      }
      pill('Leyendo el material del programa…', W / 2, PANEL.y + 190, t, fade(t, 24.3, 25.7, .2));
      // respuesta: gráfico con niveles de Fibonacci
      const r = prog(t, 25.6, 26.8);
      if (r > 0) {
        const gx = PANEL.x + 40, gy = PANEL.y + 160, gw = PANEL.w - 80, gh = 360;
        withAlpha(easeOut(r), () => {
          rrect(gx, gy, gw, gh, 20, C.bg);
          const lv = [['0.382', .3], ['0.5', .45], ['0.618', .6], ['0.786', .78]];
          lv.forEach(([l, f], i) => {
            const y = gy + 30 + f * (gh - 60), lp = easeOut(prog(t, 25.8 + i * .12, 26.4 + i * .12));
            ctx.strokeStyle = l === '0.786' ? C.accent : 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(gx + 20, y); ctx.lineTo(gx + 20 + (gw - 150) * lp, y); ctx.stroke();
            text(l, gx + gw - 24, y + 9, { size: 26, weight: 500, align: 'right', alpha: lp,
              color: l === '0.786' ? C.accent : C.muted });
          });
          ctx.strokeStyle = C.text; ctx.lineWidth = 4; ctx.beginPath();
          const pts = 40, lp = easeOut(prog(t, 25.7, 26.8));
          for (let i = 0; i <= pts * lp; i++) {
            const x = gx + 20 + i / pts * (gw - 150);
            const y = gy + 60 + (Math.sin(i / 5) * .12 + i / pts * .55 + (i > 28 ? -(i - 28) * .04 : 0)) * (gh - 100);
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          ctx.stroke();
          text('estocástico', gx + 24, gy + gh - 20, { size: 22, weight: 400, align: 'left', color: C.dim });
        });
        CASE.frases.forEach((f, i) => text(f, PANEL.x + 50, PANEL.y + 580 + i * 90,
          { size: 34, weight: 400, align: 'left', maxWidth: PANEL.w - 100,
            alpha: easeOut(prog(t, 26.6 + i * .7, 27 + i * .7)) }));
      }
    });
    footnote('Frases literales de una respuesta real de Finanflix IA', easeOut(prog(t, 26.6, 27)));
  });
}
function scenePortfolio(t) {
  const a = fade(t, 30, 34.1, .2);
  if (!a) return;
  withAlpha(a, () => {
    // tarjeta del Tracker que entra al chat (E8: hilo naranja)
    const p = spring(prog(t, 30.1, 30.9));
    const cx = lerp(W + 500, 110, p), cy = 380;
    rrect(cx, cy, 860, 330, 28, C.surface);
    text('Portfolio Tracker', cx + 40, cy + 64, { size: 38, align: 'left' });
    text('Demo — Cripto', cx + 40, cy + 108, { size: 28, weight: 400, align: 'left', color: C.muted });
    const alloc = [['BTC', 25], ['ETH', 15], ['SOL', 8], ['LINK', 7], ['USDT', 45]];
    let bx = cx + 40; const bw = 780;
    alloc.forEach(([n, v], i) => {
      const w = bw * v / 100 * easeOut(prog(t, 30.6 + i * .06, 31.2 + i * .06));
      rrect(bx, cy + 150, Math.max(w - 6, 0), 56, 8, i === 4 ? C.dim : `rgba(255,255,255,${.9 - i * .15})`);
      if (w > 100) text(n, bx + 14, cy + 190, { size: 22, weight: 700, align: 'left', color: i === 4 ? C.text : C.bg });
      bx += bw * v / 100;
    });
    text('Datos de demostración', cx + 40, cy + 280, { size: 24, weight: 400, align: 'left', color: C.dim });
    // hilo naranja hacia el chat
    const th = easeInOut(prog(t, 30.9, 31.5));
    if (th > 0) {
      ctx.strokeStyle = C.accent; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(W / 2, cy + 330); ctx.lineTo(W / 2, lerp(cy + 330, 830, th)); ctx.stroke();
      ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(W / 2, lerp(cy + 330, 830, th), 10, 0, Math.PI * 2); ctx.fill();
    }
    withAlpha(easeOut(prog(t, 31.3, 31.7)), () => {
      rrect(110, 850, 860, 130, 30, C.surface2);
      text('¿Cuánto puedo perder si el mercado cae 20%?', W / 2, 928, { size: 34, weight: 500, maxWidth: 800 });
    });
    const k = spring(prog(t, 32, 32.8));
    text('Mercado −20%.', W / 2, 1150, { size: 76, alpha: easeOut(prog(t, 31.8, 32.1)) });
    withTransform(W / 2, 1270, lerp(1.4, 1, k), 0, () =>
      rich([['Tu cartera: '], [`${CASE.caidaCartera}%`, C.accent], ['.']], W / 2, 1300, 88, clamp(k * 2)));
  });
}

// --- escena 9: decisión (34-37 s) ---------------------------------------------
function sceneDecision(t) {
  const a = fade(t, 34, 37.05, .15);
  if (!a) return;
  withAlpha(a, () => {
    ctx.fillStyle = C.black; ctx.fillRect(0, 0, W, H);
    text('La lectura es del método.', W / 2, 880, { size: 64, alpha: easeOut(prog(t, 34.1, 34.5)) });
    rich([['La decisión, '], ['tuya.', C.accent]], W / 2, 1010, 64, easeOut(prog(t, 35, 35.4)));
  });
}

// --- escena 10: cierre que repite la apertura (37-40 s) --------------------------
function sceneCTA(t) {
  const a = prog(t, 37, 37.2);
  if (!a) return;
  withAlpha(a, () => {
    // bookend: la mecha roja de la apertura, ahora como firma
    const w = easeOut(prog(t, 37, 37.8));
    ctx.save(); ctx.shadowColor = C.red; ctx.shadowBlur = 30;
    ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(W / 2, 420); ctx.lineTo(W / 2, lerp(420, 600, w)); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#E8E8F0'; ctx.fillRect(W / 2 - 18, 420, 36, 60 * w);
    const s = spring(prog(t, 37.3, 38.1));
    withTransform(W / 2, 760, lerp(.7, 1, s), 0, () => withAlpha(clamp(s * 2), () => {
      rich([['Finanflix'], [' IA', C.accent]], W / 2, 790, 110);
    }));
    withAlpha(easeOut(prog(t, 37.8, 38.2)), () => {
      rrect(W / 2 - 330, 900, 660, 120, 60, C.accent);
      text('Probala 30 días gratis', W / 2, 978, { size: 50, color: '#fff' });
      text('finanflix.com', W / 2, 1110, { size: 44, weight: 500, color: C.muted });
    });
    text('Respuestas generadas con IA. No es recomendación de inversión. Rendimientos pasados no garantizan resultados futuros.',
      W / 2, 1360, { size: 28, weight: 400, color: C.muted, maxWidth: 860, lh: 1.35, alpha: easeOut(prog(t, 37.4, 37.8)) });
  });
}

// --- render ---------------------------------------------------------------------
function renderAt(t) {
  ctx.save();
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (t < 12.3) sceneCase(t);
  sceneCases(t); sceneTraction(t); sceneMethod(t); sceneDemo(t); scenePortfolio(t); sceneDecision(t); sceneCTA(t);
  if (S.draft) {
    text('BORRADOR · serie y valores ilustrativos', W / 2, 90, { size: 26, weight: 500, color: 'rgba(255,255,255,.35)' });
  }
  if (S.safe) {
    ctx.fillStyle = 'rgba(255,59,59,.18)'; ctx.fillRect(0, 0, W, SAFE_TOP); ctx.fillRect(0, SAFE_BOTTOM, W, H - SAFE_BOTTOM);
    text('zona segura', W / 2, SAFE_TOP - 16, { size: 22, color: C.red });
  }
  ctx.restore();
}

// --- controles --------------------------------------------------------------------
const $ = id => document.getElementById(id);
let cur = 0, playing = false, last = 0;
function show(t) {
  cur = clamp(t, 0, DURATION); renderAt(cur);
  $('scrub').value = cur; $('time').textContent = `${cur.toFixed(2)} / ${DURATION.toFixed(2)}`;
  document.querySelectorAll('#scenes button').forEach((b, i) =>
    b.classList.toggle('on', cur >= SCENES[i].a && cur < SCENES[i].b));
}
function tick(now) {
  if (!playing) return;
  cur += (now - last) / 1000; last = now;
  if (cur >= DURATION) { cur = DURATION; playing = false; $('play').textContent = '▶ Play'; }
  show(cur); requestAnimationFrame(tick);
}
$('play').onclick = () => {
  playing = !playing; $('play').textContent = playing ? '❚❚ Pausa' : '▶ Play';
  if (playing) { if (cur >= DURATION) cur = 0; last = performance.now(); requestAnimationFrame(tick); }
};
$('scrub').oninput = e => show(+e.target.value);
$('safe').onchange = e => { S.safe = e.target.checked; show(cur); };
$('draft').onchange = e => { S.draft = e.target.checked; show(cur); };
SCENES.forEach(s => {
  const b = document.createElement('button');
  b.textContent = `${s.a}s · ${s.name}`; b.onclick = () => show(s.a + .01); $('scenes').appendChild(b);
});
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('play').click(); } });

// Modo exportación: ?render=1 oculta controles; render.mjs llama a window.renderAt(t).
const params = new URLSearchParams(location.search);
if (params.has('render')) document.body.classList.add('render');
if (params.get('draft') === '0') { S.draft = false; $('draft').checked = false; }
window.renderAt = renderAt; window.DURATION = DURATION; window.FPS = FPS;
Promise.all([400, 500, 700].map(w => document.fonts.load(`${w} 40px "Space Grotesk"`))).catch(() => {}).then(() => { window.ready = true; show(+(params.get('t') || 0)); });
</script>
